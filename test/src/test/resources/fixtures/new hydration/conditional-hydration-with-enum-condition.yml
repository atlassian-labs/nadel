name: "conditional hydration with enum condition"
enabled: true
overallSchema:
  service2: |
    type Query {
      barById(id: ID): Bar
    }
    type Bar {
      id: ID
      name: String
    }
  service1: |
    type Query {
      foo: Foo
    }
    enum FooType {
      BUG
      STORY
    }
    type Foo {
      id: ID
      type: FooType
      matchingBar: Bar @hydrated(
        service: "service2"
        field: "barById"
        arguments: [
          {
            name: "id"
            value: "$source.matchingBarId"
          }
        ]
        when: {
          result: {
            sourceField: "type"
            predicate: { equals: "BUG" }
          }
        }
      )
      nonMatchingBar: Bar @hydrated(
        service: "service2"
        field: "barById"
        arguments: [
          {
            name: "id"
            value: "$source.nonMatchingBarId"
          }
        ]
        when: {
          result: {
            sourceField: "type"
            predicate: { equals: "STORY" }
          }
        }
      )
    }
underlyingSchema:
  service2: |
    type Query {
      barById(id: ID): Bar
    }
    type Bar {
      id: ID
      name: String
    }
  service1: |
    type Query {
      foo: Foo
    }
    enum FooType {
      BUG
      STORY
    }
    type Foo {
      id: ID
      type: FooType
      matchingBarId: ID
      nonMatchingBarId: ID
    }
query: |
  query {
    foo {
      matchingBar {
        name
      }
      nonMatchingBar {
        name
      }
    }
  }
variables: { }
serviceCalls:
  - serviceName: "service1"
    request:
      query: |
        query {
          foo {
            __typename__hydration__matchingBar: __typename
            hydration__matchingBar__matchingBarId: matchingBarId
            hydration__matchingBar__type: type
            __typename__hydration__nonMatchingBar: __typename
            hydration__nonMatchingBar__nonMatchingBarId: nonMatchingBarId
            hydration__nonMatchingBar__type: type
          }
        }
      variables: { }
    # language=JSON
    response: |-
      {
        "data": {
          "foo": {
            "__typename__hydration__matchingBar": "Foo",
            "hydration__matchingBar__matchingBarId": "matching-bar-id",
            "hydration__matchingBar__type": "BUG",
            "__typename__hydration__nonMatchingBar": "Foo",
            "hydration__nonMatchingBar__nonMatchingBarId": "non-matching-bar-id",
            "hydration__nonMatchingBar__type": "BUG"
          }
        },
        "extensions": {}
      }
  - serviceName: "service2"
    request:
      query: |
        query {
          barById(id: "matching-bar-id") {
            name
          }
        }
      variables: { }
    # language=JSON
    response: |-
      {
        "data": {
          "barById": {
            "name": "Matching Bar"
          }
        },
        "extensions": {}
      }
# language=JSON
response: |-
  {
    "data": {
      "foo": {
        "matchingBar": {
          "name": "Matching Bar"
        },
        "nonMatchingBar": null
      }
    },
    "extensions": {}
  }
