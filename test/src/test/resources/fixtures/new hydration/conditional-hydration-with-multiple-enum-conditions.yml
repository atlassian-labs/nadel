name: "conditional hydration with multiple enum conditions"
enabled: true
overallSchema:
  service2: |
    type Query {
      bugBarById(id: ID): Bar
      storyBarById(id: ID): Bar
    }
    type Bar {
      id: ID
      name: String
    }
  service1: |
    type Query {
      foo: Foo
    }
    enum FooType {
      BUG
      STORY
    }
    type Foo {
      id: ID
      type: FooType
      bar: Bars
        @hydrated(
          service: "service2"
          field: "bugBarById"
          arguments: [
            {
              name: "id"
              value: "$source.barId"
            }
          ]
          when: {
            result: {
              sourceField: "type"
              predicate: { equals: "BUG" }
            }
          }
        )
        @hydrated(
          service: "service2"
          field: "storyBarById"
          arguments: [
            {
              name: "id"
              value: "$source.barId"
            }
          ]
          when: {
            result: {
              sourceField: "type"
              predicate: { equals: "STORY" }
            }
          }
        )
    }
    union Bars = Bar
underlyingSchema:
  service2: |
    type Query {
      bugBarById(id: ID): Bar
      storyBarById(id: ID): Bar
    }
    type Bar {
      id: ID
      name: String
    }
  service1: |
    type Query {
      foo: Foo
    }
    enum FooType {
      BUG
      STORY
    }
    type Foo {
      id: ID
      type: FooType
      barId: ID
    }
query: |
  query {
    foo {
      bar {
        ... on Bar {
          name
        }
      }
    }
  }
variables: { }
serviceCalls:
  - serviceName: "service1"
    request:
      query: |
        query {
          foo {
            __typename__hydration__bar: __typename
            hydration__bar__barId: barId
            hydration__bar__barId: barId
            hydration__bar__type: type
            hydration__bar__type: type
          }
        }
      variables: { }
    # language=JSON
    response: |-
      {
        "data": {
          "foo": {
            "__typename__hydration__bar": "Foo",
            "hydration__bar__barId": "bar-id",
            "hydration__bar__type": "STORY"
          }
        },
        "extensions": {}
      }
  - serviceName: "service2"
    request:
      query: |
        query {
          storyBarById(id: "bar-id") {
            name
          }
        }
      variables: { }
    # language=JSON
    response: |-
      {
        "data": {
          "storyBarById": {
            "name": "Story Bar"
          }
        },
        "extensions": {}
      }
# language=JSON
response: |-
  {
    "data": {
      "foo": {
        "bar": {
          "name": "Story Bar"
        }
      }
    },
    "extensions": {}
  }
