name: "graphqlcontext-is-present-on-input"
enabled: true
# language=GraphQL
overallSchema:
  MyService: |
    type Query {
      hello(arg: String): World
    }
    type World {
      id: ID
      name: String
    }
# language=GraphQL
underlyingSchema:
  MyService: |
    type Query {
      hello(arg: String): World
    }

    type World {
      id: ID
      name: String
    }
# language=GraphQL
query: |
  query {
    hello(arg: "x") {
      name
    }
  }
variables: { }
serviceCalls:
  - serviceName: "MyService"
    request:
      # language=GraphQL
      query: |
        query ($v0: String) {
          hello(arg: $v0) {
            name
          }
        }
      variables: {"v0":"x"}
    # language=JSON
    response: |-
      {
        "data": {
          "hello": null
        },
        "extensions": {}
      }
# language=JSON
response: |-
  {
    "data": {
      "hello": null
    },
    "extensions": {}
  }
