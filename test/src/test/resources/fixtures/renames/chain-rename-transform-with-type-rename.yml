name: "chain rename transform with type rename"
enabled: true
# language=GraphQL
overallSchema:
  MyService: |
    type Query {
      test(arg: String): Test @renamed(from: "world")
    }
    type Test @renamed(from: "World") {
      id: ID
      cities(continent: Continent): [String] @renamed(from: "places")
    }
    enum Continent {
      Africa
      Antarctica
      Asia
      Oceania
      Europe
      NorthAmerica
      SouthAmerica
    }
# language=GraphQL
underlyingSchema:
  MyService: |
    type Query {
      world(arg: String): World
    }
    type World {
      id: ID
      places(continent: Continent): [String]
    }
    enum Continent {
      Africa
      Antarctica
      Asia
      Oceania
      Europe
      NorthAmerica
      SouthAmerica
    }
# So the hook associated with this test will change the arg values
query: |
  query {
    test(arg: "Hello World") {
      __typename
      id
      cities(continent: Oceania)
    }
  }
variables: { }
serviceCalls:
  - serviceName: "MyService"
    request:
      # language=GraphQL
      query: |
        query ($v0: Continent, $v1: String) {
          rename__test__world: world(arg: $v1) {
            __typename
            __typename__rename__cities: __typename
            id
            rename__cities__places: places(continent: $v0)
          }
        }
      variables: {"v0":"Asia","v1":"aaarrg"}
    # language=JSON
    response: |-
      {
        "data": {
          "rename__test__world": {
            "__typename": "World",
            "__typename__rename__cities": "World",
            "id": "Earth",
            "rename__cities__places": [
              "Uhh yea I know cities"]
          }
        },
        "extensions": {}
      }
# language=JSON
response: |-
  {
    "data": {
      "test": {
        "__typename": "Test",
        "id": "Earth",
        "cities": [
          "Uhh yea I know cities"
        ]
      }
    },
    "errors": []
  }
